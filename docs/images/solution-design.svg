<text x="116" y="164" font-size="11" font-weight="700" fill="#0f6cbd" text-anchor="start">NSM-MCSB-MAP.JSON</text>
<text x="116" y="186" font-size="15" font-weight="700" fill="#242424" text-anchor="start">The map: MCSB control to NSM clause</text>
<text x="116" y="208" font-size="13" font-weight="400" fill="#605e5c" text-anchor="start">Which controls, and which of their policies, support which NSM clause,</text>
<text x="116" y="226" font-size="13" font-weight="400" fill="#605e5c" text-anchor="start">with a strength, a scope and a reason. The only hand-written file.</text>
