<text x="88.0" y="372" font-size="12" font-weight="400" fill="#605e5c" text-anchor="start">build_initiative.py copies each policy</text>
<text x="88.0" y="389" font-size="12" font-weight="400" fill="#605e5c" text-anchor="start">from Microsoft; no ID typed by hand</text>
<rect x="388.0" y="330" width="296.0" height="74" rx="8" fill="#ffffff" stroke="#c8c6c4" stroke-width="1.5"/>
<text x="400.0" y="352" font-size="13.5" font-weight="700" fill="#242424" text-anchor="start">Assigned in audit only</text>
<text x="400.0" y="372" font-size="12" font-weight="400" fill="#605e5c" text-anchor="start">azuredeploy.json, DoNotEnforce;</text>
<text x="400.0" y="389" font-size="12" font-weight="400" fill="#605e5c" text-anchor="start">its identity has no role</text>
