<text x="116" y="292" font-size="11" font-weight="700" fill="#0f6cbd" text-anchor="start">THE INITIATIVE</text>
<text x="116" y="314" font-size="15" font-weight="700" fill="#242424" text-anchor="start">132 built-in policies in 20 groups, one per NSM measure</text>
