<text x="116" y="470" font-size="11" font-weight="700" fill="#0f6cbd" text-anchor="start">RESULTS</text>
<text x="116" y="492" font-size="15" font-weight="700" fill="#242424" text-anchor="start">Azure Policy and Defender for Cloud</text>
<text x="116" y="514" font-size="13" font-weight="400" fill="#605e5c" text-anchor="start">Compliance per policy and resource, and a regulatory compliance</text>
<text x="116" y="532" font-size="13" font-weight="400" fill="#605e5c" text-anchor="start">standard laid out by NSM measure (needs a paid Defender plan)</text>
<rect x="20" y="566" width="680" height="70" rx="8" fill="#fff8e6" stroke="#ffb900" stroke-width="1.5"/>
<text x="36" y="590" font-size="14" font-weight="700" fill="#242424" text-anchor="start">Azure is one part of NSM</text>
<text x="36" y="610" font-size="12.5" font-weight="400" fill="#424242" text-anchor="start">Entra ID, Microsoft 365, Defender and Intune are measured by the NSM GP-IKT 2.1 Maester pack.</text>
<text x="36" y="628" font-size="12.5" font-weight="400" fill="#424242" text-anchor="start">Governance, network, OT and plans need an owner who attests them.</text>
